name: Daily AEO run

on:
  schedule:
    # 09:23 UTC = 18:23 Korea time, after the Gemini free-tier quota resets (~17:00 KST).
    # (Off the hour on purpose: GitHub delays jobs scheduled at :00 the most.)
    - cron: "23 9 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write   # lets the job commit the refreshed dashboard data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Asia/Seoul          # so run_date is the Korean date
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect answers
        run: python run.py

      - name: Extract brands (v1)
        if: always()          # still extract whatever was collected, even if run.py failed
        run: python extract.py

      - name: Export dashboard data
        if: always()
        run: python export_metrics.py

      - name: Commit dashboard data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/metrics.json
          git diff --staged --quiet || (git commit -m "Update dashboard data" && git push)
